name: Flutter Build

on:
  push:
    branches: [ "main" ]      # Needed to create GitHub Releases
    
env:
  APP_NAME: "Receipt Ranger"
  FLUTTER_VERSION: 3.35.4
  JDK_VERSION: 17
  OS: ubuntu-latest

jobs:
  build:
    name: Build APK
    runs-on: ${{env.OS}}
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    env:
      KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APK_DIR: ${{github.workspace}}/build/app/outputs/flutter-apk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{env.JDK_VERSION}}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Decode Keystore (if signing is configured)
        if: env.KEYSTORE_PATH != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Build APK
        run: |
            flutter build apk --release \
              --keystore-path android/app/upload-keystore.jks \
              --keystore-password "$KEYSTORE_PASSWORD" \
              --key-alias "$KEY_ALIAS" \
              --key-password "$KEY_PASSWORD"

      - name: Extract Version from Project
        id: version
        run: |
          VERSION=`grep "version:" pubspec.yaml | awk '{print $2}' | awk -F '+' '{print $1}'`
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK with Version
        run: |
          mv ${{env.APK_DIR}}/app-release.apk ${{env.APK_DIR}}/Receipt-Ranger-${{ steps.version.outputs.version }}.apk

      - name: Upload Artifacts (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: Receipt-Ranger-APKS
          path: ${{env.APK_DIR}}/*.apk

  release:
    runs-on: ${{env.OS}}
    needs: build
    permissions:
      contents: write
      
    env:
        APP_VERSION: ${{needs.build.outputs.version}}
    
    steps:
      - name: Download Release Note
        id: release-note
        run: |
          wget https://raw.githubusercontent.com/${{github.repository}}/refs/heads/main/notes/RELEASE-${{env.APP_VERSION}}.md
          echo "`cat RELEASE-${{env.APP_VERSION}}.md`" >> ${{GITHUB_OUTPUT}}

      - name: Download Artifacts (APKs)
        uses: actions/download-artifact@v4
        with:
          path: ${{github.workspace}}/build
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{env.APP_NAME}} ${{env.APP_VERSION}}
          body_path: ${{github.workspace}}/RELEASE-${{env.APP_VERSION}}.md
          tag_name: v${{env.APP_VERSION}}
          files: |
            ${{github.workspace}}/build/*.*
          make_latest: true
          
      - name: Send Mails
        if: false
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_ADDRESS}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: ${{APP_NAME}} ${{env.APP_NAME_VERSION}} released !
          to: amadoubenjamain@gmail.com,nassir.hamadou@gmail.com,assakayecelestin@gmail.com
          from: Amadou Benjamain
          body: "Hello, ${{env.APP_NAME}} ${{env.APP_VERSION}} has just been released, look at the new features !\n\n${{steps.release-note.outputs.note}}\n\nDownload and try: https://github.com/${{github.repository}}/releases/latest"
